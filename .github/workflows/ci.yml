name: Conformance and published consumers
"on":
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Syntax and publication payload checks
        run: |
          python3 -m compileall -q tools
          python3 tools/lint_workflows.py
          python3 tools/test_publication_notices.py
          python3 tools/test_release.py
          git show --format= --check HEAD
      - name: Portable tests and Linux Native execution
        run: ./gradlew -Popencc.targets=jvm,linuxX64,js,wasmJs jvmTest linuxX64Test jsNodeTest wasmJsNodeTest
      - name: Pinned upstream differential matrices
        run: >-
          ./gradlew -Popencc.targets=jvm,linuxX64,js,wasmJs
          upstreamConformance upstreamWriterConformance upstreamPhraseConformance
          upstreamJiebaConformance upstreamDataDetection resourceConformance
      - name: Complete and selective data acceptance
        run: |
          python3 tools/test_data.py
          python3 tools/test_upstream_data_invariants.py
      - name: Build local publications and CLI distributions
        run: >-
          ./gradlew -Popencc.targets=jvm,linuxX64,js,wasmJs
          publishAllPublicationsToConsumerRepository :opencc-cli:writeJvmClasspath
          :opencc-cli:bundleJvmCli :opencc-cli:bundleLinuxX64Cli
      - name: Published-artifact consumers and graphs
        run: |
          python3 tools/verify_publications.py --targets jvm,linuxX64,js,wasmJs
          python3 tools/test_consumers.py --profile full :kit:jvmTest :kit:jsNodeTest :kit:wasmJsNodeTest
      - name: Published-engine JMH workloads and whole-output native comparison
        run: python3 tools/run_benchmarks.py --probes-ready
      - name: Tool processes and unpacked distributions
        run: |
          python3 tools/test_cli.py --backend jvm
          python3 tools/test_cli.py --backend native --native-target linuxX64
          python3 tools/test_cli_upstream.py --backend jvm
          python3 tools/test_cli_upstream.py --backend native --native-target linuxX64
          python3 tools/test_cli_distributions.py jvm linuxX64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: linux-conformance
          include-hidden-files: true
          path: |
            **/build/reports/tests/**
            .cache/cli-contract/report-*.json
            .cache/cli-upstream/report-*.json
            .cache/cli-contract/differences-*.json
            .cache/cli-unpacked/report.json
            .cache/publications-verification.json
            .cache/oracle-build.log
            .cache/benchmarks/**

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Prepare Android runtime and real published variants
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager 'platforms;android-36' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          ./gradlew -Popencc.targets=android publishAllPublicationsToConsumerRepository
      - name: Execute R8 release applications using shipped resources
        run: python3 tools/test_android_runtime.py --emulator
      - name: Build and verify the physical-device benchmark APK
        run: |
          ./gradlew -p benchmarks/android assembleRelease reportBenchmarkDependencies
          python3 tools/verify_android_benchmark.py --output .cache/benchmarks/android-build.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: android-runtime
          include-hidden-files: true
          path: |
            .cache/android-runtime/**
            .cache/benchmarks/android-build.json
            benchmarks/android/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Windows common/runtime tests and all three executables
        run: >-
          .\gradlew.bat '-Popencc.targets=jvm,mingwX64' jvmTest mingwX64Test
          :opencc-cli:writeJvmClasspath :opencc-cli:linkOpenccReleaseExecutableMingwX64
          :opencc-cli:linkOpencc_dictReleaseExecutableMingwX64
          :opencc-cli:linkOpencc_phrase_extractReleaseExecutableMingwX64
      - name: Unicode paths, conversion, in-place output and binary writer smoke
        run: python tools/test_cli_smoke.py --native-target mingwX64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-tests
          path: '**/build/reports/tests/**'

  apple:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Select Xcode 26 and record host tools
        run: |
          python3 tools/select_ci_xcode.py
          xcodebuild -version
          xcrun simctl list runtimes
          sdkmanager 'platforms;android-36'
      - name: All-target compilation, API compatibility and reference docs
        run: ./gradlew checkKotlinAbi dokkaGenerate jvmTest macosArm64Test iosSimulatorArm64Test resourceConformance
      - name: Publish every KMP variant locally
        run: ./gradlew publishAllPublicationsToConsumerRepository
      - name: Every target artifact and independent consumers
        run: |
          python3 tools/verify_publications.py --targets jvm,android,js,wasmJs,iosArm64,iosSimulatorArm64,iosX64,macosArm64,macosX64,linuxX64,mingwX64
          python3 tools/test_consumers.py --profile full :kit:jvmTest :kit:jsNodeTest :kit:wasmJsNodeTest :kit:iosSimulatorArm64Test :android:assembleRelease
      - name: Focused exports, ABI and direct host-language consumers
        run: |
          ./gradlew -p interop checkKotlinAbi jvmTest jsNodeTest macosArm64Test iosSimulatorArm64Test linkReleaseFrameworkMacosArm64 jsBrowserProductionLibraryDistribution
          python3 tools/test_exports.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: apple-api-and-consumers
          include-hidden-files: true
          path: |
            **/build/reports/tests/**
            build/dokka/html/**
            .cache/publications-verification.json
            .cache/exports/report.json

  size:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
      - name: Prepare SDKs and attributed local publications
        run: |
          python3 tools/select_ci_xcode.py
          sdkmanager 'platforms;android-36'
          ./gradlew -Popencc.targets=jvm,android,js,wasmJs,iosSimulatorArm64 publishAllPublicationsToConsumerRepository
      # Run every platform gate even when another gate fails. Budgets are never auto-updated.
      - name: Android release shrinking and dependency download budgets
        if: success() || failure()
        run: python3 tools/measure_android.py --check
      - name: Production JS/Wasm delivered-byte budgets and browser execution
        if: success() || failure()
        run: python3 tools/measure_web.py --check
      - name: Desktop Wasm warmed conversion and fresh-browser startup evidence
        if: success() || failure()
        run: python3 tools/run_web_benchmark.py --check-target --output .cache/measurements/web-performance-current.json
      - name: Swift release application budgets and simulator execution
        if: success() || failure()
        run: python3 tools/measure_apple.py --check --small-binary
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: size-and-runtime-evidence
          include-hidden-files: true
          path: |
            .cache/measurements/*-current.json
            .cache/consumer-xcode/*.log

  release:
    needs: [linux, windows, apple, android, size]
    if: startsWith(github.ref, 'refs/tags/v') && vars.OPENCC_PUBLIC_RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
