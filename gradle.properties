org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
android.useAndroidX=true
# Kotlin 2.4.0 Wasm incremental linkage failed after API additions; full linkage is verified.
kotlin.incremental.wasm=false
# Browser adapters use narrow host functions; no module needs the legacy DOM API library.
kotlin.js.stdlib.dom.api.included=false
